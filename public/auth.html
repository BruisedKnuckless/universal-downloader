<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login or create an account to upload and manage your files on Universal Downloader.">
  <title>Login / Register — Universal Downloader</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⬇</text></svg>">
</head>
<body data-page="auth">
  <div class="bg-glow"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <div class="logo-icon">⬇</div>
      <span>Universal Downloader</span>
    </a>
    <div class="navbar-links" id="nav-links"></div>
  </nav>

  <!-- Auth Card -->
  <div class="auth-page">
    <div class="auth-card">
      <h2>Welcome</h2>
      <p class="auth-subtitle">Login or create an account to upload files</p>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="login-tab">Login</button>
        <button class="auth-tab" id="register-tab">Register</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="login-form">
        <div class="auth-error" id="login-error"></div>
        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="input" placeholder="you@example.com" required>
        </div>
        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="input" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Login</button>
      </form>

      <!-- Register Form -->
      <form class="auth-form hidden" id="register-form">
        <div class="auth-error" id="register-error"></div>
        <div class="input-group">
          <label for="register-username">Username</label>
          <input type="text" id="register-username" class="input" placeholder="cooluser42" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+">
        </div>
        <div class="input-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" class="input" placeholder="you@example.com" required>
        </div>
        <div class="input-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" class="input" placeholder="Min 6 characters" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
      </form>

      <div class="auth-footer">
        <a href="/">← Back to Library</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
