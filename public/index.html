<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Universal Downloader — A free, open library to upload, share, and download files. Browse images, documents, archives, and more.">
  <title>Universal Downloader — Open File Library</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⬇</text></svg>">
</head>

<body data-page="library">
  <div class="bg-glow"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <div class="logo-icon">⬇</div>
      <span>Welcome fellas!</span>
    </a>
    <div class="navbar-links" id="nav-links"></div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <h1>Viraj's Vault</h1>
    <p>Upload, share, and download files freely. Browse the collection below.</p>

    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" class="input" placeholder="Search files by name...">
    </div>

    <div class="storage-bar-container">
      <div class="storage-bar-label">
        <span>Total Storage</span>
        <span id="storage-label">Loading...</span>
      </div>
      <div class="storage-bar">
        <div class="storage-bar-fill" id="storage-fill" style="width: 0%"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- Tag Filters -->
    <div class="tags-filter" id="tags-filter">
      <button class="tag-pill active">All</button>
    </div>

    <!-- Files Grid -->
    <div class="files-grid" id="files-grid">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </main>

  <footer class="footer">
    <p>Universal Downloader — Open source file sharing library</p>
  </footer>

  <script src="/js/app.js"></script>
</body>

</html>
